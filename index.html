<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Admin dashboard</title>
        <style>
            @font-face {
                font-family: main-font;
                src: url(assets/Fighting\ Spirit\ 2.woff2), format(woff2);
            }
            * {
                font-family: main-font;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="search">
                <img src="assets/loupe.png" alt="magnifying-glass">
                <input type="text" class="input">
            </div>
            <div>
                <button style="border: none;"><img src="assets/bell.png" alt="Notifications"></button>
                <img src="assets/pfp.jpg" alt="pfp">
                <h2>David</h2>
            </div>
        </header>

        <div class="sidebar">
            <div class="dashboard-title">
                <img src="assets/star-rings-svgrepo-com.svg">
                <h1>dashboard</h1>
            </div>
            <div class="links">
                <a href="">Home</a>
                <a href="">Profile</a>
                <a href="">Message</a>
                <a href="">History</a>
                <a href="">Tasks</a>
                <a href="">Communities</a>
            </div>
            <div class="addetional-links">
                <a href="">Settings</a>
                <a href="">Support</a>
                <a href="">Privacy</a>
            </div>
        </div>

        <nav class="user-info">
                <span class="info">
                    <img src="assets/pfp.jpg" alt="pfp">
                    <span>
                        <p>Hi there!</p>
                        <h2>David Ayman</h2>
                        <a href="https://github.com/70David70">@70David70</a>
                    </span>
                </span>
                <span class="buttons">
                    <button id="new-btn">New</button>
                    <button id="upload-btn">Upload</button>
                    <button id="share-btn">Share</button>
                </span>
        </nav>

        <article>
            <span class="left-side">
                <h3>Your projects</h3>
                    <a href="https://70david70.github.io/Odin-rock-paper-scissors/"><img src="assets/rps-game.PNG" alt="">
                        <div>
                            <p>rock paper scissors</p>
                        </div>
                    </a>
                    <a href="https://70david70.github.io/Odin-sign-up/"><img src="assets/signup-page.PNG" alt="">
                        <div>
                            <p>Signup page</p>
                        </div>
                    </a>
                    <a href="https://70david70.github.io/Odin-Etch-a-Sketch/"><img src="assets/drawing-app.PNG" alt="">
                        <div>
                            <p>Drawing app</p>
                        </div>
                    </a>
            </span>
            <span class="right-side">
                <div class="announcements">
                    <h3>Announcements</h3>
                    <div class="acontent">
                        <div>some content1</div>
                        <div>some content2</div>
                        <div>some content3</div>
                    </div>
                </div>
                <div class="trending">
                    <h3>Trending</h3>
                    <div class="bcontent">
                        <div>some content1</div>
                        <div>some content2</div>
                        <div>some content3</div>
                    </div>
                </div>
            </span>
        </article>
        
    </body>
</html>
